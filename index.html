<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>El Mundo de Matt</title>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #242424;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      background-color: #242424;
      background-image: url('index.png');
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      transition: opacity 0.25s ease;
    }
    #progress-track {
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 4%;
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: rgba(255, 255, 255, 0.92);
      transition: width 0.12s linear;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="loading" aria-label="Cargando">
    <div id="progress-track">
      <div id="progress-bar"></div>
    </div>
  </div>

  <script src="index.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const loading = document.getElementById('loading');
    const progressBar = document.getElementById('progress-bar');
    const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":50929232,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});

    engine.startGame({
      canvas: canvas,
      onProgress: (current, total) => {
        if (total > 0) {
          progressBar.style.width = `${Math.min(100, current / total * 100)}%`;
        }
      }
    }).then(() => {
      progressBar.style.width = '100%';
      loading.style.opacity = '0';
      setTimeout(() => loading.remove(), 250);
    }).catch((error) => {
      console.error(error);
    });
  </script>
</body>
</html>
