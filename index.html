<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta
		name="viewport"
		content="width=device-width, height=device-height, user-scalable=no, initial-scale=1.0"
	>
	<title>El Mundo de Matt</title>

	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			border: 0;
			overflow: hidden;
			background: #000;
		}

		body {
			display: flex;
			justify-content: center;
			align-items: center;
			color: white;
			touch-action: none;
		}

		#canvas {
			width: min(100vw, 56.25vh) !important;
			height: min(100vh, 177.7778vw) !important;
			margin: 0;
			padding: 0;
			border: 0;
			display: block;
			flex-shrink: 0;
		}

		#canvas:focus {
			outline: none;
		}

		#status,
		#status-splash,
		#status-progress {
			position: absolute;
			left: 0;
			right: 0;
		}

		#status,
		#status-splash {
			top: 0;
			bottom: 0;
		}

		#status {
			background-color: #242424;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			visibility: hidden;
		}

		#status-splash {
			max-height: 100%;
			max-width: 100%;
			margin: auto;
		}

		#status-splash.show-image--false {
			display: none;
		}

		#status-splash.fullsize--true {
			width: 100%;
			height: 100%;
			object-fit: contain;
		}

		#status-splash.use-filter--false {
			image-rendering: pixelated;
		}

		#status-progress,
		#status-notice {
			display: none;
		}

		#status-progress {
			bottom: 10%;
			width: 50%;
			margin: 0 auto;
		}

		#status-notice {
			background-color: #5b3943;
			border: 1px solid #9b3943;
			border-radius: 0.5rem;
			color: #e0e0e0;
			font-family: "Noto Sans", "Droid Sans", Arial, sans-serif;
			line-height: 1.3;
			margin: 0 2rem;
			overflow: hidden;
			padding: 1rem;
			text-align: center;
			z-index: 1;
		}
	</style>

	<link
		id="-gd-engine-icon"
		rel="icon"
		type="image/png"
		href="index.icon.png"
	>
	<link
		rel="apple-touch-icon"
		href="index.apple-touch-icon.png"
	>
</head>

<body>
	<canvas id="canvas">
		Tu navegador no admite el elemento canvas.
	</canvas>

	<noscript>
		Tu navegador no admite JavaScript.
	</noscript>

	<div id="status">
		<img
			id="status-splash"
			class="show-image--true fullsize--true use-filter--true"
			src="index.png"
			alt=""
		>
		<progress id="status-progress"></progress>
		<div id="status-notice"></div>
	</div>

	<script src="index.js"></script>

	<script>
		const GODOT_CONFIG = {
			"args": [],
			"canvasResizePolicy": 2,
			"emscriptenPoolSize": 8,
			"ensureCrossOriginIsolationHeaders": true,
			"executable": "index",
			"experimentalVK": false,
			"fileSizes": {
				"index.pck": 8477544,
				"index.wasm": 37902138
			},
			"focusCanvas": true,
			"gdextensionLibs": [],
			"godotPoolSize": 4
		};

		const GODOT_THREADS_ENABLED = false;
		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const statusOverlay = document.getElementById("status");
			const statusProgress = document.getElementById("status-progress");
			const statusNotice = document.getElementById("status-notice");

			let initializing = true;
			let statusMode = "";

			function setStatusMode(mode) {
				if (statusMode === mode || !initializing) {
					return;
				}

				if (mode === "hidden") {
					statusOverlay.remove();
					initializing = false;
					return;
				}

				statusOverlay.style.visibility = "visible";
				statusProgress.style.display =
					mode === "progress" ? "block" : "none";
				statusNotice.style.display =
					mode === "notice" ? "block" : "none";
				statusMode = mode;
			}

			function setStatusNotice(message) {
				while (statusNotice.lastChild) {
					statusNotice.removeChild(statusNotice.lastChild);
				}

				const lines = message.split("\n");

				lines.forEach((line) => {
					statusNotice.appendChild(
						document.createTextNode(line)
					);
					statusNotice.appendChild(
						document.createElement("br")
					);
				});
			}

			function displayFailureNotice(error) {
				console.error(error);

				if (error instanceof Error) {
					setStatusNotice(error.message);
				} else if (typeof error === "string") {
					setStatusNotice(error);
				} else {
					setStatusNotice(
						"Se ha producido un error desconocido."
					);
				}

				setStatusMode("notice");
				initializing = false;
			}

			const missing = Engine.getMissingFeatures({
				threads: GODOT_THREADS_ENABLED
			});

			if (missing.length !== 0) {
				if (
					GODOT_CONFIG["serviceWorker"] &&
					GODOT_CONFIG["ensureCrossOriginIsolationHeaders"] &&
					"serviceWorker" in navigator
				) {
					let serviceWorkerRegistrationPromise;

					try {
						serviceWorkerRegistrationPromise =
							navigator.serviceWorker.getRegistration();
					} catch (error) {
						serviceWorkerRegistrationPromise =
							Promise.reject(
								new Error(
									"Ha fallado el registro del Service Worker."
								)
							);
					}

					Promise.race([
						serviceWorkerRegistrationPromise
							.then((registration) => {
								if (registration != null) {
									return Promise.reject(
										new Error(
											"Ya existe un Service Worker."
										)
									);
								}

								return registration;
							})
							.then(() => engine.installServiceWorker()),

						new Promise((resolve) => {
							setTimeout(resolve, 2000);
						})
					])
						.then(() => {
							window.location.reload();
						})
						.catch((error) => {
							console.error(
								"Error al registrar el Service Worker:",
								error
							);
						});
				} else {
					const missingMessage =
						"Error\nEl navegador no dispone de las siguientes funciones necesarias:\n";

					displayFailureNotice(
						missingMessage + missing.join("\n")
					);
				}
			} else {
				setStatusMode("progress");

				engine.startGame({
					onProgress: function (current, total) {
						if (current > 0 && total > 0) {
							statusProgress.value = current;
							statusProgress.max = total;
						} else {
							statusProgress.removeAttribute("value");
							statusProgress.removeAttribute("max");
						}
					}
				}).then(
					() => {
						setStatusMode("hidden");
					},
					displayFailureNotice
				);
			}
		}());
	</script>
</body>
</html>
